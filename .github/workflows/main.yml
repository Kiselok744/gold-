name: Build Fabric Mod for 26.3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Unzip Mod Files
        run: |
          unzip cyclops.zip -d project_dir
          if [ -d "project_dir/cyclops-mod" ]; then
            mv project_dir/cyclops-mod/* .
          elif [ -d "project_dir/Cyclops mod" ]; then
            mv "project_dir/Cyclops mod/"* .
          else
            mv project_dir/* .
          fi

      - name: Generate Gradle Wrapper
        run: gradle wrapper

      - name: Build Mod with Gradle
        run: ./gradlew build

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fabric-Mod-JAR
          path: build/libs/*.jar
